<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <script>
    // SPA fallback for static servers (e.g. GitHub Pages).
    // When a direct URL like /committee is requested, the server returns this
    // 404.html. This script redirects to index.html while preserving the path
    // as a query parameter so the client-side router can pick it up.
    var pathSegmentsToKeep = 0; // set to 1+ if deployed in a subdirectory on GitHub Pages
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <p>Redirecting&hellip;</p>
</body>
</html>
